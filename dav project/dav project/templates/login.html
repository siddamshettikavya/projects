<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Login - Reliance Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: linear-gradient(135deg,#f8fafc,#e9f1ff); height:100vh; display:flex; align-items:center; justify-content:center; }
    .card { backdrop-filter: blur(6px); background: rgba(255,255,255,0.7); border-radius:12px; box-shadow:0 8px 30px rgba(0,0,0,0.12); padding:30px; width:380px; }
    .logo { font-weight:700; color:#0b5ed7; margin-bottom:10px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo text-center"><h3>Reliance Dashboard</h3></div>
    {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
    <form method="post">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input name="username" class="form-control" placeholder="admin" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input name="password" type="password" class="form-control" placeholder="1234" required>
      </div>
      <button class="btn btn-primary w-100" type="submit">Login</button>
    </form>
    <p class="mt-3 text-center text-muted">Use <b>admin</b> / <b>1234</b></p>
  </div>
</body>
</html>
